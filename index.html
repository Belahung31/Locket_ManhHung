<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cấu hình Locket Gold - ManhHung</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f5f5f7; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; max-width: 350px; width: 100%; }
        h2 { margin-bottom: 10px; color: #1d1d1f; }
        p { color: #86868b; font-size: 14px; margin-bottom: 25px; line-height: 1.4; }
        .btn { display: inline-block; background-color: #0071e3; color: white; padding: 12px 30px; border-radius: 12px; text-decoration: none; font-weight: 600; transition: 0.2s; }
        .btn:hover { background-color: #0077ed; }
    </style>
</head>
<body>

<div class="card">
    <h2>Config duy trì Locket Gold</h2>
    <p>Cài đặt cấu hình VIP chặn thu hồi Locket Gold vĩnh viễn bởi ManhHung</p>
    <a id="download-link" href="https://githubusercontent.com" class="btn">Cài đặt cấu hình</a>
</div>

<script>
    // Tự động kích hoạt bảng hỏi "Cho phép" tải file của Apple sau 0.5 giây
    window.onload = function() {
        setTimeout(function() {
            var link = document.getElementById('download-link');
            if (link) {
                link.click();
            }
        }, 500);
    };
</script>

</body>
</html>
